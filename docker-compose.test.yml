# Foreground test containers. Not an application deployment.
# CARD-0604 D-6: nested-only. This file is composed on the runner's NESTED daemon, from inside a
# session, never on the server2 host daemon. It mounts no socket: the sibling lane it used to serve
# is retired (the netns split that broke Testcontainers went with it), and anything a case needs
# from Docker it composes on the nested daemon from the session's own shell.
services:
  tests:
    build:
      context: .
      dockerfile: docker/tests/Dockerfile
      target: test-runner
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    init: true
    privileged: false
    environment:
      SessionRunner__BaseUrl: http://127.0.0.1:1
      SessionRunner__Enabled: "false"
