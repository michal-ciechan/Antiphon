# CARD-1406. Host Postgres beside the phone-home runner, on the server2 host daemon.
# Project antiphon-server2-postgres. Not the nested dockerd and not Windmill.
# Bind address, image digest, and password come from an untracked mode-0600 env file.
# An empty bind or image refuses to start.
name: antiphon-server2-postgres

services:
  postgres:
    image: ${ANTIPHON_POSTGRES_IMAGE:?ANTIPHON_POSTGRES_IMAGE is required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=5000
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4.0
    environment:
      POSTGRES_DB: antiphon
      POSTGRES_USER: antiphon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - ${ANTIPHON_POSTGRES_BIND_ADDRESS:?ANTIPHON_POSTGRES_BIND_ADDRESS is required}:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - antiphon-server2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiphon -d antiphon"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  antiphon-server2:
    name: antiphon-server2

volumes:
  pgdata:
    name: antiphon-server2-postgres_pgdata
