# CARD-1406. Host Postgres beside the phone-home runner, on the server2 host daemon.
# Project antiphon-server2-postgres. Not the nested dockerd and not Windmill.
# Bind address, image digest, and password come from an untracked mode-0600 env file.
# An empty bind or image refuses to start.
# The volume name is pinned. Use this file only with project
# antiphon-server2-postgres. Another project name still mounts that volume.
# Image for this move: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
# (PostgreSQL 16.14, the desktop version). Never the floating postgres:16 tag (16.16 now).
name: antiphon-server2-postgres

services:
  postgres:
    image: ${ANTIPHON_POSTGRES_IMAGE:?ANTIPHON_POSTGRES_IMAGE is required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=5000
    restart: unless-stopped
    # CARD-1406 CPU isolation, cgroup v1 keys only. Postgres owns three whole physical
    # cores: CPUs 0-2 and their SMT siblings 12-14. The runner services in
    # docker-compose.server2-runner.yml take 3-11,15-23, so the sets are disjoint.
    # cpus follows the cpuset: 6.0 for six logical CPUs (the plan said 3.0 for 0-2).
    # shm_size lifts /dev/shm above the 64 MB engine default for parallel query.
    # blkio weight 800 against the default 500 is a bias, not a reservation.
    cpuset: "0-2,12-14"
    cpus: 6.0
    mem_limit: 8g
    shm_size: 1gb
    blkio_config:
      weight: 800
    environment:
      POSTGRES_DB: antiphon
      POSTGRES_USER: antiphon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - ${ANTIPHON_POSTGRES_BIND_ADDRESS:?ANTIPHON_POSTGRES_BIND_ADDRESS is required}:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - antiphon-server2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiphon -d antiphon"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  antiphon-server2:
    name: antiphon-server2

volumes:
  pgdata:
    name: antiphon-server2-postgres_pgdata
