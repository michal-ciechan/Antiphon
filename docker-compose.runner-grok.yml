# CARD-0490 companion compose. Does not replace docker-compose.dev.yml.
# PhoneHome__ServerOrigin is injected at launch (PHONE_HOME_SERVER_ORIGIN). Never hardcode
# the live Aspire ports. scripts/verify-phone-home-grok.ps1 supplies an isolated origin.
services:
  session-runner-grok:
    build:
      context: .
      dockerfile: docker/session-runner-grok/Dockerfile
    init: true
    environment:
      PhoneHome__Enabled: "true"
      PhoneHome__RunnerId: grok-linux
      PhoneHome__ServerOrigin: ${PHONE_HOME_SERVER_ORIGIN:?PHONE_HOME_SERVER_ORIGIN must be the isolated Antiphon URL}
      PhoneHome__SecretPath: /run/secrets/phone-home
      PhoneHome__StoreIdPath: /state/runner-store-id
      PhoneHome__AllowedCwd: /work
      PhoneHome__GrokHome: /state/grok
      GROK_HOME: /state/grok
    volumes:
      - type: bind
        source: ${PHONE_HOME_WORKSPACE}
        target: /work
        read_only: true
      - type: bind
        source: ${PHONE_HOME_STATE}
        target: /state
      - type: bind
        source: ${PHONE_HOME_GROK_HOME}
        target: /state/grok
      - type: bind
        source: ${PHONE_HOME_SECRET_FILE}
        target: /run/secrets/phone-home
        read_only: true
    # No published runner port. The container phones home.
