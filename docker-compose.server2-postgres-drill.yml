# CARD-1406 scratch restore drill. Not the production service.
# Project antiphon-server2-postgres-drill. The volume name is pinned to this
# scratch volume only. Published on loopback port 5434, never the tailnet.
# Network antiphon-server2-postgres-drill, not the production network.
# Image for this move: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
# (PostgreSQL 16.14, the desktop version). Never the floating postgres:16 tag (16.16 now).
name: antiphon-server2-postgres-drill

services:
  postgres:
    image: ${ANTIPHON_POSTGRES_IMAGE:?ANTIPHON_POSTGRES_IMAGE is required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=5000
    restart: unless-stopped
    # CARD-1406 CPU isolation, cgroup v1 keys only (operator 2026-11-18: pin one CPU, the
    # rest shared; no cores reserved for the session runner). Postgres is pinned to one
    # physical core, CPU 0 and its SMT sibling 12. The pin is not exclusive: the runner
    # services in docker-compose.server2-runner.yml set no cpuset and also run on 0 and 12,
    # where cpu_shares 2048 (against the default 1024) makes Postgres win by weight.
    # The cpuset is the one line to change; two physical cores is cpuset "0-1,12-13".
    # No cpus quota: the cpuset already caps Postgres at 2 logical CPUs.
    # shm_size lifts /dev/shm above the 64 MB engine default for parallel query.
    # blkio weight 800 against the default 500 is a bias, not a reservation.
    cpuset: "0,12"
    cpu_shares: 2048
    mem_limit: 8g
    shm_size: 1gb
    blkio_config:
      weight: 800
    environment:
      POSTGRES_DB: antiphon
      POSTGRES_USER: antiphon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - antiphon-server2-postgres-drill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiphon -d antiphon"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  antiphon-server2-postgres-drill:
    name: antiphon-server2-postgres-drill

volumes:
  pgdata:
    name: antiphon-server2-postgres-drill_pgdata
