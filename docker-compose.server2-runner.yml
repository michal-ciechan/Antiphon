# CARD-0604 D-2: the standalone persistent server2 deployment. It is the ONLY standing Antiphon
# process on server2 -- no server, no Postgres. The runner phones home to the desktop production
# server and owns a nested dockerd (D-1); everything a session starts through Docker lives on that
# nested daemon, so the host daemon never sees it and no socket is ever mounted.
# Project name is fixed: COMPOSE_PROJECT_NAME=antiphon-runner.
name: antiphon-runner

services:
  state-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    # Named explicitly, like the runner: `up --no-build` against a service with only a build block
    # derives `antiphon-runner-state-init` and tries to PULL it, which is a denied access to a
    # repository that does not exist. The deploy builds this exact tag.
    image: antiphon-server2/server:${SOURCE_SHA12:?SOURCE_SHA12 is required}
    user: "0:0"
    entrypoint: ["/bin/sh", "/stack/init-state.sh"]
    volumes:
      - work:/work
      - runner-state:/runner-state
    restart: "no"

  session-runner:
    build:
      context: .
      dockerfile: docker/session-runner-grok/Dockerfile
      target: session-testing
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: antiphon-server2/session-testing:${SOURCE_SHA12:?SOURCE_SHA12 is required}
    user: "0:0"
    privileged: true
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    tmpfs:
      - /run/antiphon
    environment:
      ASPNETCORE_URLS: http://+:8080
      PhoneHome__Enabled: "true"
      PhoneHome__RunnerId: server2
      PhoneHome__ServerOrigin: ${PHONE_HOME_SERVER_ORIGIN:?PHONE_HOME_SERVER_ORIGIN must be the production Antiphon origin}
      # CARD-0604 D-1: the compose secret file is mounted with the HOST uid at 0600 and the
      # runner runs as uid 1654, so it can never open /run/secrets/phone-home. The entrypoint
      # stages it onto the /run/antiphon tmpfs owned by the app uid, exactly as it already
      # does for the deploy key, and this is the staged copy the runner reads.
      ANTIPHON_PHONE_HOME_SECRET_SOURCE: /run/secrets/phone-home
      PhoneHome__SecretPath: /run/antiphon/phone-home
      PhoneHome__StoreIdPath: /state/runner-store-id
      PhoneHome__AllowedCwd: /work
      PhoneHome__Capacity: "2"
      PhoneHome__GrokHome: /state/grok
      GROK_HOME: /state/grok
      # CARD-0628 D-6: one Claude store in three places. CLAUDE_CONFIG_DIR is the runner process's
      # own (TranscriptTailer reads it), PhoneHome__ClaudeHome is the auth probe's target, and the
      # server projects the same value as PhoneHomeRunner:ChildClaudeHome onto every launch.
      CLAUDE_CONFIG_DIR: /state/claude
      PhoneHome__ClaudeHome: /state/claude
      # CARD-0628 D-1: the `claude setup-token` OAuth token, passed through from the deploy
      # environment (injected from the vault at deploy time) and inherited by every pty child. No
      # value here and never an image layer; unset, the runner falls back to an interactive
      # `claude auth login` under /state/claude. An Anthropic API key is never a fallback.
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTIPHON_DEPLOY_KEY_SOURCE: /run/secrets/antiphon-deploy-key
      SessionRunner__SessionLogPath: /state/session-runner
      SessionRunner__PtyHostDir: /tmp/antiphon-pty-hosts
      SessionRunner__PtyBackend: inbox
      ANTIPHON_PTY_BACKEND: inbox
      SessionRunner__Herdr__Enabled: "false"
      Serilog__LogPath: /state/runner-logs
      Agents__GrokCredentialProbeEnabled: "false"
      TMPDIR: /tmp
    volumes:
      - work:/work
      - runner-state:/state
      - dind-data:/var/lib/docker
    secrets:
      - antiphon-deploy-key
      - phone-home
    # CARD-0604 D-2: /health and `docker info` both pass on a runner that has never once
    # registered, which is how 304 consecutive phone-home failures sat behind a green
    # "healthy". The staged secret's readability as the app uid is the third leg: without it
    # the connection loop can only ever throw, so an unreadable secret is an unhealthy runner.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health && docker info >/dev/null && setpriv --reuid=1654 --regid=1654 --clear-groups /bin/sh -c 'head -c 1 \"$$PhoneHome__SecretPath\" >/dev/null'"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      state-init:
        condition: service_completed_successfully
    # No published port. The container phones home.

secrets:
  antiphon-deploy-key:
    file: ${ANTIPHON_DEPLOY_KEY_FILE:?ANTIPHON_DEPLOY_KEY_FILE is required}
  phone-home:
    file: ${PHONE_HOME_SECRET_FILE:?PHONE_HOME_SECRET_FILE is required}

volumes:
  work:
  runner-state:
  dind-data:
