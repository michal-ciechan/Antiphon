# The default pr-review workflow (docs/features/012-review-engine/design.md 3.3).
# A repo overrides it with .antiphon/review/workflow.yaml, layered like the prompts (design 10).
# Edges: "a -> b", "a[output] -> b", or a mapping that adds maxIterations, the overflow gate that
# opens over the limit (D-2), and a description.
workflow: pr-review
version: 1
sections:
  intake:  { title: Intake, nodes: [intake, delta, categorise, select, group, packs] }
  review:  { title: Review, nodes: [review, reviewer, collate, verify, publish], collapsed: true }
  decide:  { title: Decide, nodes: [route, await-fixes, record-drift, needs-human-approval, bot-approve, human-approve, human-review] }
  branch:  { title: Branch maintenance, nodes: [base-moved, base-drift, update-branch, await-merge], collapsed: true }
nodes:
  intake:        { kind: code, run: Intake, description: "Pins the base and head SHAs, fetches the mirror and reads policy, checks and workflow at the base." }
  delta:         { kind: code, run: Delta, description: "Full review on the first iteration; afterwards limits the work to the change since the last reviewed SHA." }
  categorise:    { kind: decision, run: Categorise, chain: decisions-default, description: "Asks Jev for the change kind, risk areas and blast radius in one batched call." }
  select:        { kind: decision, run: SelectChecks, chain: decisions-default, description: "Prefilters the check catalogue by triggers, then asks which candidate checks apply." }
  group:         { kind: code, run: GroupChecks, description: "Bin-packs the selected checks into reviewer groups by category and token budget." }
  packs:         { kind: code, run: BuildPacks, description: "Writes one context pack per reviewer group: a shared prefix plus the group's checks." }
  review:        { kind: fan-out, over: groups, node: reviewer, policy: all, description: "Runs one reviewer per group and waits for all of them." }
  reviewer:      { kind: agent, role: Reviewer, output: review-findings/1, runner: { labels: [review] }, description: "A read-only agent session that reviews its pack and answers in review-findings/1." }
  collate:       { kind: join, from: review, run: CollateFindings, description: "Gathers every reviewer's findings, collapses duplicates and re-anchors them at the reviewed SHA." }
  verify:        { kind: completion, run: VerifyFindings, chain: completions-cheap, description: "A cheaper model tries to disprove each finding; disproved findings are dropped and recorded." }
  publish:       { kind: code, run: Publish, description: "Posts the findings above the round's bar as one PR review and updates the summary and statuses." }
  route:         { kind: code, run: RouteAfterRound, outputs: [bot-round-limit, findings, clean], description: "Chooses what follows the round: wait for fixes, a human review, or the approval check." }
  await-fixes:   { kind: wait, on: [push, recheck, close, base-moved, update-requested], timeout: 14d, description: "Parks the run, with no seat held, until the author pushes fixes or someone asks for a recheck. Times out after 14 days." }
  record-drift:  { kind: code, run: RecordBaseDrift, description: "Notes that the base moved while fixes are awaited. No model call, no re-review and no branch update; the next push re-runs the drift check." }
  base-drift:    { kind: decision, run: BaseDriftCheck, chain: decisions-default, outputs: [affected, unaffected], description: "Decides whether base commits the approved PR is missing could affect it." }
  needs-human-approval: { kind: code, run: NeedsHumanApproval, outputs: ["yes", "no"], description: "Answers one question: must a human approve this PR?" }
  bot-approve:   { kind: code, run: BotApprove, description: "Approves when no blocker or finding is open, every check is accounted for and CI is green." }
  human-approve: { kind: gate, queue: owning-team, decisions: [approve, another-round, close], description: "The owning team approves, asks for another round with a steer, or closes the review." }
  human-review:  { kind: gate, queue: owning-team, decisions: [approve, another-round, close], description: "Opens after the bot-only round limit, or when a loop's iteration limit is exceeded." }
  base-moved:    { kind: code, run: CheckBaseMoved, outputs: [unchanged, moved, behind], description: "Compares the reviewed base with the base tip after an approval. No model call (D-37)." }
  update-branch: { kind: code, run: UpdateBranch, outputs: [approved, open], description: "Brings the branch up to date by merge or rebase; AI resolves conflicts." }
  await-merge:   { kind: wait, on: [merge, close, push, base-moved], description: "Holds the approved PR until it's merged or closed. Keeps the approval while only the base branch moves." }
edges:
  - intake -> delta -> categorise -> select -> group -> packs -> review -> collate -> verify -> publish -> route
  - route[bot-round-limit] -> human-review
  - route[findings] -> await-fixes
  - route[clean] -> needs-human-approval
  - needs-human-approval[no] -> bot-approve -> base-moved
  - needs-human-approval[yes] -> human-approve
  - human-approve[approve] -> base-moved
  - { edge: "human-approve[another-round] -> intake", description: "Carries the steer prompt." }
  - human-review[another-round] -> intake
  - human-review[approve] -> base-moved
  - { edge: "base-moved[unchanged] -> await-merge", description: "No update and no model call." }
  - base-moved[moved|behind] -> base-drift
  - update-branch[approved] -> await-merge
  - { edge: "update-branch[open] -> await-fixes", description: "After an author opt-in; its own push is base-only." }
  - { edge: "await-fixes[push|recheck] -> intake", maxIterations: 20, overflow: human-review, description: "Delta re-runs the drift check if a drift is recorded." }
  - { edge: "await-merge[push] -> intake", maxIterations: 20, overflow: human-review, description: "Revokes the approval." }
  - { edge: "await-fixes[base-moved] -> record-drift", description: "D-19: no branch update while fixes are awaited." }
  - record-drift -> await-fixes
  - { edge: "await-fixes[update-requested] -> update-branch", description: "The author opts in (D-19)." }
  - await-merge[base-moved] -> base-drift
  - { edge: "base-drift[affected] -> intake", maxIterations: 10, overflow: human-review, description: "Carries a rebase steer." }
  - { edge: "base-drift[unaffected] -> update-branch", description: "Approval carried forward (patch ids unchanged)." }
