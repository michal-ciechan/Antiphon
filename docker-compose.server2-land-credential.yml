# CARD-1776. Include this file with the production server compose. CARD-1775 owns
# docker-compose.server2-server.yml; this fragment only names mount paths.
# The token bytes stay in the directory named by RUNNER_GITHUB_TOKEN_DIR.
# The allow-list is repository URLs, written by scripts/server2-repository-mirrors.ps1.
# RUNNER_GIT_IDENTITY_FILE names the host file of user.name and user.email. It is
# not a secret and is not baked into the image. Compose refuses to start when the
# variable is unset. Git:IdentityFile refuses before git when the file is unusable.
services:
  server:
    environment:
      Git__PushCredentialTokenFile: /run/antiphon/github-token/token
      Git__PushCredentialPolicyPath: /run/antiphon/push-allow-list
      Git__IdentityFile: /run/antiphon/gitconfig
      GIT_CONFIG_GLOBAL: /run/antiphon/gitconfig
    volumes:
      - ${RUNNER_GITHUB_TOKEN_DIR:?RUNNER_GITHUB_TOKEN_DIR is required}:/run/antiphon/github-token:ro
      - ${SERVER_PUSH_ALLOW_LIST:?SERVER_PUSH_ALLOW_LIST is required}:/run/antiphon/push-allow-list:ro
      - ${RUNNER_GIT_IDENTITY_FILE:?RUNNER_GIT_IDENTITY_FILE is required}:/run/antiphon/gitconfig:ro
