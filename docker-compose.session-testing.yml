# Opt-in ordinary testing runner. Base compose stays socket-free.
services:
  session-runner:
    build:
      context: .
      dockerfile: docker/session-runner-grok/Dockerfile
      target: session-testing
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    group_add:
      - ${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      Agents__GrokCredentialProbeEnabled: "false"
